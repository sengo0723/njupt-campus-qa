name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install portable test dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install -r requirements-ci.txt
      - name: Audit public files
        run: python scripts/check_public_repository.py
      - name: Test portable logic and frozen data
        run: python -m pytest -q
      - name: Build the chat interface
        run: |
          npm install --global pnpm@11.6.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
