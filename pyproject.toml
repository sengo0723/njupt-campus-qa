[project]
name = "njupt-campus-qa"
version = "0.1.0"
description = "Offline NJUPT campus assistant with independent hybrid RAG and MLX LoRA SFT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn", "httpx", "beautifulsoup4", "lxml", "pypdf", "pdfplumber",
  "numpy", "rank-bm25", "jieba", "torch", "transformers>=4.51,<6", "tokenizers",
  "matplotlib", "onnxruntime", "psutil", "huggingface-hub", "pytest"
]

[project.optional-dependencies]
train = ["mlx-lm[train]; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
njupt-qa = "njupt_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/njupt_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires the locally downloaded BGE tokenizer"]
